<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxide — voice lab notebook</title>
<meta name="description" content="Oxide turns what researchers say at the bench into structured entries in their Obsidian logbook. Arabic and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* White lab bench, scientific blue, teal accents, light grey bands. All text comes from content.json (edited in ar/admin/oxide.html). */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --grey:#F4F6F8; --card:#FFFFFF; --ink:#16212E; --ink-2:#5A6675; --line:#E3E8EE;
  --blue:#1E5AA8; --blue-d:#174A8C; --blue-t:#E8F0FA; --teal:#14B8A6; --teal-t:#E4F6F3; --amber-t:#FFF4DC; --amber:#8A5A00;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:72px}
section.grey{background:var(--grey)}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:clamp(28px,4.2vw,42px);font-weight:700;letter-spacing:-.015em}
h3{font-size:19px;font-weight:600}
p{margin:0}
.lead{font-size:clamp(17px,2vw,20px);color:var(--ink-2);max-width:62ch;margin-top:12px}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:18px;direction:ltr;color:var(--ink);text-decoration:none}
.logo b{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--blue) 50%,var(--teal) 50%)}
.lang{margin-inline-start:auto;font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn{display:inline-flex;align-items:center;font-family:var(--display);font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;border:0;cursor:pointer}
.btn:hover{background:var(--blue-d)}

.hero{padding-block:84px 76px;background:linear-gradient(180deg,var(--blue-t),#fff 85%)}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-t)}
.hero h1{font-size:clamp(40px,6.4vw,72px);font-weight:700;letter-spacing:-.025em;margin-block:20px 18px;max-width:16ch;color:var(--ink)}
.hero h1 .accent{color:var(--blue)}
.hero .btn{margin-top:28px}

.ribbon{background:var(--blue);color:#fff}
.ribbon .wrap{display:flex;flex-wrap:wrap;gap:12px 34px;justify-content:center;padding-block:15px;font-family:var(--display);font-weight:600;font-size:15.5px}

.badge{display:inline-block;font-size:12.5px;font-family:var(--display);font-weight:600;padding:3px 10px;border-radius:999px;background:var(--amber-t);color:var(--amber);vertical-align:middle;margin-inline-start:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin-top:30px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;min-width:0}
.card .ic{font-size:28px;line-height:1;display:block;margin-bottom:12px}
.card h3{margin-bottom:6px}
.card p{color:var(--ink-2);font-size:15.5px}
.card .tag{display:inline-block;font-size:13.5px;background:var(--blue-t);color:var(--blue);border-radius:8px;padding:2px 9px;margin-bottom:8px}
.card .note{display:block;margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--ink);direction:ltr;text-align:start}
.steps{list-style:none;padding:0;margin:30px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;counter-reset:s}
.steps li{counter-increment:s;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:22px;min-width:0}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--blue);color:#fff;font-family:var(--display);font-weight:700;margin-bottom:12px}
.steps li:last-child::before{background:var(--teal)}
.steps p{color:var(--ink-2);font-size:15.5px;margin-top:6px}

.pilot{border-radius:30px;padding:48px clamp(20px,5vw,56px);display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff}
.pilot h2{color:#fff}
.pilot p{color:rgba(255,255,255,.9);margin-top:14px}
.contact{background:#fff;color:var(--ink);border-radius:20px;padding:22px}
.contact .addr{font-family:var(--mono);font-size:17px;word-break:break-all;user-select:all;direction:ltr}
.contact ul{margin:12px 0 16px;padding-inline-start:18px;color:var(--ink-2);font-size:15px}
.contact .btn{background:var(--ink)}
@media (max-width:860px){.pilot{grid-template-columns:1fr}}
footer{padding-block:32px 44px;color:var(--ink-2);font-size:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.loading{padding:120px 0;text-align:center;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="logo" href="#top"><b></b>OXIDE</a>
  <button class="lang" id="lang" type="button">عربي</button>
  <a class="btn" href="#pilot" id="navcta">Join the pilot</a>
</div></header>
<main id="top"><div class="wrap loading" id="loading">Loading…</div></main>
<div class="wrap"><footer><span style="direction:ltr">OXIDE · <span id="yr"></span></span><span id="foot"></span></footer></div>
<noscript><p class="wrap">Oxide: a voice lab notebook for researchers. Please enable JavaScript to view this page.</p></noscript>

<script>
(function(){
  var data = null, lang = 'en';
  try { lang = localStorage.getItem('oxide-lang') || (/^ar/.test(navigator.language) ? 'ar' : 'en'); } catch (e) {}
  var main = document.getElementById('top');
  function tx(o){ return o ? (o[lang] || o.en || '') : ''; }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

  function render(){
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('lang').textContent = lang === 'ar' ? 'English' : 'عربي';
    document.getElementById('navcta').textContent = tx(data.hero.button);
    document.getElementById('foot').textContent = tx(data.footer);
    main.innerHTML = '';

    // hero
    var h = el('section', 'hero'), w = el('div', 'wrap');
    var pill = el('span', 'pill'); pill.append(el('i'), el('span', '', tx(data.hero.pill))); w.append(pill);
    var h1 = el('h1'), title = tx(data.hero.title), words = title.split(' ');
    // last two words in the accent colour
    h1.append(document.createTextNode(words.slice(0, -2).join(' ') + (words.length > 2 ? ' ' : '')), el('span', 'accent', words.slice(-2).join(' ')));
    w.append(h1, el('p', 'lead', tx(data.hero.text)));
    var b = el('a', 'btn', tx(data.hero.button)); b.href = '#pilot'; w.append(b);
    h.append(w); main.append(h);

    // ribbon
    if (data.ribbon && data.ribbon.length) { var r = el('div', 'ribbon'), rw = el('div', 'wrap'); data.ribbon.forEach(function(x){ rw.append(el('span', '', tx(x))); }); r.append(rw); main.append(r); }

    // sections
    (data.sections || []).forEach(function(s){
      var sec = el('section', s.bg === 'grey' ? 'grey' : ''), sw = el('div', 'wrap');
      if (s.id) sec.id = s.id;
      var h2 = el('h2', '', tx(s.title)); if (tx(s.badge)) h2.append(el('span', 'badge', tx(s.badge)));
      sw.append(h2);
      if (tx(s.lead)) sw.append(el('p', 'lead', tx(s.lead)));
      var items = s.items || [];
      if (s.layout === 'steps' && items.length) {
        var ol = el('ol', 'steps');
        items.forEach(function(it){ var li = el('li'); li.append(el('h3', '', tx(it.title)), el('p', '', tx(it.text))); ol.append(li); });
        sw.append(ol);
      } else if (items.length) {
        var g = el('div', 'cards');
        items.forEach(function(it){
          var c = el('div', 'card');
          if (it.icon) c.append(el('span', 'ic', it.icon));
          c.append(el('h3', '', tx(it.title)));
          if (tx(it.tag)) c.append(el('span', 'tag', tx(it.tag)));
          c.append(el('p', '', tx(it.text)));
          if (it.note) c.append(el('span', 'note', it.note));
          g.append(c);
        });
        sw.append(g);
      }
      sec.append(sw); main.append(sec);
    });

    // pilot
    var p = data.pilot || {}, ps = el('section'); ps.id = 'pilot';
    var pw = el('div', 'wrap'), box = el('div', 'pilot'), left = el('div');
    left.append(el('h2', '', tx(p.title)), el('p', '', tx(p.text)));
    var ct = el('div', 'contact');
    ct.append(el('div', '', lang === 'ar' ? 'راسلنا على' : 'Email'));
    var addr = el('div', 'addr', p.email || ''); ct.append(addr);
    var ul = el('ul'); (p.bullets || []).forEach(function(x){ ul.append(el('li', '', tx(x))); }); ct.append(ul);
    var cp = el('button', 'btn', lang === 'ar' ? 'انسخ العنوان' : 'Copy address'); cp.type = 'button';
    cp.onclick = function(){
      var done = function(){ cp.textContent = lang === 'ar' ? 'انتسخ ✓' : 'Copied ✓'; setTimeout(function(){ cp.textContent = lang === 'ar' ? 'انسخ العنوان' : 'Copy address'; }, 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(addr.textContent).then(done, function(){ selectAddr(); }); else selectAddr();
      function selectAddr(){ var rg = document.createRange(); rg.selectNodeContents(addr); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); }
    };
    ct.append(cp); box.append(left, ct); pw.append(box); ps.append(pw); main.append(ps);
  }

  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('lang').onclick = function(){ lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('oxide-lang', lang); } catch (e) {} if (data) render(); };
  fetch('content.json', { cache: 'no-cache' }).then(function(r){ return r.json(); }).then(function(d){ data = d; render(); })
    .catch(function(){ document.getElementById('loading').textContent = 'Could not load the page content. Please refresh.'; });
})();
</script>
</body>
</html>
